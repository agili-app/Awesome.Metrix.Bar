name: Update dashboards

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

env:
  GIT_AUTHOR_NAME: Agili
  GIT_AUTHOR_EMAIL: git@agili.app
  GIT_COMMITTER_NAME: Agili
  GIT_COMMITTER_EMAIL: git@agili.app

concurrency:
  group: update-dashboards

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile', '--ignore-scripts']
      - name: Update dashboards
        id: update
        continue-on-error: true
        run: node scripts/update-dashboards.ts
      - name: Publish updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
        run: |
          git diff --check
          git diff --quiet -- registry/sources.json && exit 0
          vp run registry:build
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git add registry/sources.json
          git commit -m "chore: update dashboards"
          git push origin "HEAD:$DEFAULT_BRANCH"
          # GITHUB_TOKEN pushes do not emit push events; dispatch assistant conflict checks only when open assistant PRs exist.
          prs=$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f base="$DEFAULT_BRANCH" -F per_page=100 --paginate --jq '.[] | select(.head.repo.full_name == env.GH_REPO and (.head.ref | startswith("automation/pi/"))) | .number')
          for number in $prs; do
            gh workflow run pi-assistant.yml --ref "$DEFAULT_BRANCH" -f issue="$number"
          done
      - name: Check update result
        if: steps.update.outcome == 'failure'
        run: exit 1
